name: Release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate release version
        id: version
        run: |
          set -euo pipefail
          source_version="$(go run ./cmd/tracehub version)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[1-9][0-9]*)?$ ]]; then
              echo "invalid release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            if [[ "$(git cat-file -t "refs/tags/${GITHUB_REF_NAME}")" != "tag" ]]; then
              echo "release tag must be annotated: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            if [[ "${GITHUB_REF_NAME}" != "v${source_version}" ]]; then
              echo "tag ${GITHUB_REF_NAME} does not match source version v${source_version}" >&2
              exit 1
            fi
          fi
          echo "version=${source_version}" >> "${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "${GITHUB_OUTPUT}"

      - name: Check source
        run: make check

      - name: Build artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          make dist
          (
            cd dist
            sha256sum tracehub-* > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          if [[ "$(./dist/tracehub-linux-amd64 version)" != "${VERSION}" ]]; then
            echo "built binary version does not match ${VERSION}" >&2
            exit 1
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: tracehub-${{ steps.version.outputs.version }}
          path: |
            dist/tracehub-darwin-amd64
            dist/tracehub-darwin-arm64
            dist/tracehub-linux-amd64
            dist/tracehub-linux-arm64
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Set up QEMU
        if: github.ref_type == 'tag'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: github.ref_type == 'tag'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push container image
        if: github.ref_type == 'tag'
        id: container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.version.outputs.image }}:${{ github.ref_name }}
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify public container image
        if: github.ref_type == 'tag'
        env:
          IMAGE: ${{ steps.version.outputs.image }}
          IMAGE_DIGEST: ${{ steps.container.outputs.digest }}
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker buildx imagetools inspect "${IMAGE}@${IMAGE_DIGEST}"

      - name: Create draft GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ steps.version.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          if [[ "${VERSION}" == *-alpha.* ]]; then
            prerelease+=(--prerelease)
          fi
          # shellcheck disable=SC2016 -- backticks in the format string are literal Markdown.
          notes="$(printf 'Automated draft with verified release artifacts. Container image: `%s:%s`. Complete the requirement status and verification notes before publishing.' "${IMAGE}" "${GITHUB_REF_NAME}")"
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            "${prerelease[@]}" \
            --title "TraceHub ${GITHUB_REF_NAME}" \
            --notes "${notes}" \
            dist/tracehub-darwin-amd64 \
            dist/tracehub-darwin-arm64 \
            dist/tracehub-linux-amd64 \
            dist/tracehub-linux-arm64 \
            dist/SHA256SUMS
