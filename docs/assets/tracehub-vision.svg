<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">TraceHub across agents and platforms</title>
  <desc id="desc">A MacBook running Codex and Claude Code, a Linux workstation running OpenCode and CodeBuddy, and an Android phone running ZCode connect bidirectionally to TraceHub.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .device { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .agent { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .label { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526078; }
      .hub { font: 800 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .line { fill: none; stroke: #64748b; stroke-width: 3; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>
  <text x="600" y="62" text-anchor="middle" class="title">AI work across agents and platforms</text>
  <text x="600" y="91" text-anchor="middle" class="label">One history layer, available from every connected device</text>

  <path class="line" d="M 390 225 C 455 225, 455 300, 510 320"/>
  <path class="line" d="M 390 515 C 455 515, 455 425, 510 400"/>
  <path class="line" d="M 810 370 C 760 370, 740 370, 690 370"/>

  <g aria-label="MacBook running Codex and Claude Code">
    <rect x="70" y="145" width="320" height="160" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
    <rect x="96" y="174" width="62" height="42" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M 87 224 H 167 L 177 233 H 77 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
    <text x="190" y="192" class="device">MacBook</text>
    <text x="190" y="216" class="label">macOS</text>
    <rect x="96" y="251" width="105" height="32" rx="6" fill="#dbeafe"/>
    <text x="148" y="273" text-anchor="middle" class="agent">Codex</text>
    <rect x="213" y="251" width="145" height="32" rx="6" fill="#fee2e2"/>
    <text x="285" y="273" text-anchor="middle" class="agent">Claude Code</text>
  </g>

  <g aria-label="Linux workstation running OpenCode and CodeBuddy">
    <rect x="70" y="435" width="320" height="160" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <rect x="91" y="464" width="76" height="54" rx="4" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <path d="M 116 528 H 142 M 129 518 V 528" stroke="#15803d" stroke-width="3"/>
    <text x="190" y="482" class="device">Linux workstation</text>
    <text x="190" y="506" class="label">Linux</text>
    <rect x="91" y="541" width="122" height="32" rx="6" fill="#dcfce7"/>
    <text x="152" y="563" text-anchor="middle" class="agent">OpenCode</text>
    <rect x="225" y="541" width="143" height="32" rx="6" fill="#fef3c7"/>
    <text x="296" y="563" text-anchor="middle" class="agent">CodeBuddy</text>
  </g>

  <g aria-label="Android phone running ZCode">
    <rect x="810" y="290" width="320" height="160" rx="8" fill="#ffffff" stroke="#e11d48" stroke-width="2"/>
    <rect x="841" y="316" width="54" height="94" rx="8" fill="#ffe4e6" stroke="#be123c" stroke-width="2"/>
    <circle cx="868" cy="397" r="3" fill="#be123c"/>
    <text x="925" y="337" class="device">Android phone</text>
    <text x="925" y="361" class="label">Android</text>
    <rect x="925" y="384" width="112" height="32" rx="6" fill="#ffe4e6"/>
    <text x="981" y="406" text-anchor="middle" class="agent">ZCode</text>
  </g>

  <g aria-label="TraceHub self-hosted session hub">
    <rect x="510" y="285" width="180" height="170" rx="8" fill="#fff7d6" stroke="#d97706" stroke-width="3"/>
    <path d="M 555 326 H 645 V 376 H 555 Z M 570 341 H 630 M 570 354 H 617" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round"/>
    <text x="600" y="411" text-anchor="middle" class="hub">TraceHub</text>
    <text x="600" y="436" text-anchor="middle" class="label">Session history</text>
  </g>

  <text x="600" y="645" text-anchor="middle" class="label">Bidirectional sharing across devices, clients, and accounts</text>
</svg>
